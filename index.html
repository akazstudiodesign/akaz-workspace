<style>

.mu{color:var(--mu)}.sm{font-size:12px}

.tag.w{background:var(--o);color:#fff}.tag.ok{background:var(--g);color:var(--on)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}

.cb{padding:10px 12px;display:grid;gap:4px}

:root{--gl:rgba(255,255,255,.58);--gb:rgba(255,255,255,.75)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(30,40,20,.55);--gb:rgba(255,255,255,.09)}}:root[data-theme="dark"]{--gl:rgba(30,40,20,.55);--gb:rgba(255,255,255,.09)}

.login{background:radial-gradient(640px 420px at 85% 110%,rgba(255,102,51,.35),transparent 60%),#1c2b10}.login div{padding:30px;border-radius:26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}

rent;text-align:left;transition:.2s}.doc-add-folder>span{font-size:22px;color:var(--g)}.doc-latest{margin-top:34px}.doc-latest h2{font-size:19px;margin:0}.doc-latest-head{margin-bottom:12px}.doc-file-list{display:grid;gap:8px}.doc-file{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--gb);border-radius:15px;background:var(--gl)}.doc-file-icon,.doc-detail-icon{width:42px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);color:var(--g);font-weight:700;flex:none}.doc-file-main{display:grid;gap:2px;flex:1;min-width:0}.doc-open{border:0;background:none;padding:0;text-align:left;font:600 14px inherit;color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-open:hover{color:var(--g);text-decoration:underline}.doc-file-main span,.doc-file-main small{font-size:12px;color:var(--mu)}.doc-file-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.doc-file-actions .btn{font-size:12px;padding:5px 9px;text-decoration:none}.doc-footnote{margin-top:20px;color:var(--mu);font-size:12px}.doc-back{border:0;background:none;padding:0 0 12px;color:var(--mu);cursor:pointer;font:inherit}.doc-head-actions{display:flex;gap:8px;flex-wrap:wrap}.doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.doc-empty{padding:44px 18px;border:1px dashed var(--ln);border-radius:18px;text-align:center;color:var(--mu);display:grid;justify-items:center;gap:7px}.doc-empty>span{font-size:30px}.doc-empty p{margin:0;font-size:13px}.doc-detail{display:flex;align-items:flex-start;gap:18px;margin-top:24px;padding:24px;border:1px solid var(--gb);border-radius:20px;background:var(--gl)}.doc-detail-icon{width:58px;height:64px;font-size:22px}.doc-detail h2{margin:0 0 8px;font-size:20px}.doc-detail p{color:var(--mu);margin:5px 0 12px}.doc-detail .btn{text-decoration:none;display:inline-block;margin-top:8px}.doc-head>div>p{margin:5px 0}.doc-head>div>.sm{letter-spacing:.1em;font-size:11px}
@media(max-width:760px){.doc-intro h1,.doc-head h1{font-size:28px}.doc-folder-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.doc-folder{min-height:105px;padding:12px;gap:8px}.doc-folder-art{transform:scale(.82);transform-origin:left center;width:50px}.doc-folder-copy b{font-size:13px}.doc-file{align-items:flex-start;flex-wrap:wrap}.doc-file-main{min-width:calc(100% - 60px)}.doc-file-actions{width:100%;padding-left:54px}.doc-detail{padding:16px}}

/* ===== Navegação AKAZ: sidebar integrada ===== */
#app>aside#sd{width:268px;min-width:268px;padding:20px 14px 16px;background:color-mix(in srgb,var(--bg2) 88%,var(--card));border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:0;overflow-y:auto;box-shadow:4px 0 24px rgba(28,43,16,.035)}
#sd .logo{font-size:19px;padding:2px 9px 18px;gap:10px;letter-spacing:-.02em}
#sd .logo i{width:29px;height:29px;border-radius:9px;box-shadow:0 3px 10px rgba(28,43,16,.12)}
#sd .side-search{position:relative;margin:0 2px 15px}
#sd .side-search .search-ico{position:absolute;left:12px;top:9px;color:var(--mu);font-size:17px;pointer-events:none}
#sd .side-search input{width:100%;height:38px;padding:8px 34px 8px 36px;border:1px solid var(--ln);border-radius:11px;background:var(--card);color:var(--tx);font:inherit;font-size:13px;outline:none}
#sd .side-search input:focus{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 12%,transparent)}
#sd .side-search kbd{position:absolute;right:10px;top:9px;color:var(--mu);font:11px inherit}
#sd .profile-card{display:flex;align-items:center;gap:10px;padding:10px 9px;margin:0 0 13px;border:1px solid var(--ln);border-radius:13px;background:color-mix(in srgb,var(--card) 78%,transparent);text-align:left;width:100%;cursor:pointer}
#sd .profile-card:hover{background:var(--card);border-color:color-mix(in srgb,var(--g) 30%,var(--ln))}
#sd .profile-avatar{width:39px;height:39px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#d9dfcf,#aab99a);color:#1c2b10;font-weight:700;font-size:13px}
#sd .profile-avatar img{width:100%;height:100%;object-fit:cover}
#sd .profile-meta{min-width:0;display:grid;line-height:1.3;flex:1}
#sd .profile-meta b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sd .profile-meta small{font-size:11px;color:var(--mu);margin-top:3px}
#sd .profile-arrow{color:var(--mu);font-size:17px}
#sd .side-rule{height:1px;background:var(--ln);margin:2px 4px 10px}
#sd .grp{font-size:10px;letter-spacing:.11em;font-weight:700;margin:12px 9px 6px;color:var(--mu)}
#sd .nav{display:flex;align-items:center;gap:11px;padding:9px 11px;margin:1px 0;border-radius:10px;font-size:13px;font-weight:500;min-height:38px;transition:background .16s,color .16s,transform .16s}
#sd .nav .ic{width:18px;display:inline-flex;justify-content:center;align-items:center;font-size:16px;color:var(--mu)}
#sd .nav:hover{background:color-mix(in srgb,var(--bei) 65%,transparent);transform:translateX(1px)}
#sd .nav.on{background:color-mix(in srgb,var(--g) 13%,var(--card));color:var(--g);font-weight:650;box-shadow:inset 3px 0 var(--g)}
#sd .nav.on .ic{color:var(--g)}
#sd .nav.dis{opacity:.4}
#sd .side-bottom{margin-top:auto;padding-top:14px}
#sd .side-bottom .side-rule{margin-bottom:9px}
#sd .side-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;color:var(--mu);font-size:11px}
#sd .side-footer strong{color:var(--tx);font-weight:600}
#sd .side-empty{font-size:12px;color:var(--mu);padding:10px 12px;display:none}
.top{padding-left:24px;padding-right:24px}
.top .top-user{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:var(--on);font-size:11px;font-weight:700}
@media(max-width:760px){
 #app>aside#sd{width:min(86vw,290px);min-width:0;padding:18px 14px}
 aside.off{margin-left:calc(-1 * min(86vw,290px))}
 aside.open{margin-left:0}
 #sd .side-bottom{padding-bottom:12px}
 .top{padding:10px 12px}
}


/* ===== Refinamentos de identidade e barra superior ===== */
body{font-family:Inter,Arial,sans-serif}
h1,h2,h3,.logo,.cov,.pv,.kpis b{font-family:Inter,Arial,sans-serif}
#sd .side-brand{margin-top:18px;padding:14px 10px 4px;border-top:1px solid var(--ln);font:650 14px/1.3 Inter,Arial,sans-serif;letter-spacing:-.025em;color:var(--tx)}
#sd .side-footer{padding-top:7px}
#sd .logo{display:none}
.top{min-height:54px;gap:10px}
.top-context{display:flex;align-items:center;gap:9px;min-width:0;margin-left:8px;font-size:13px;color:var(--mu)}
.top-context span{font-weight:600;letter-spacing:.04em;color:var(--mu);font-size:11px}
.top-context i{font-style:normal;opacity:.5}
.top-context b{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notify-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.68);border-radius:13px;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.24));color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 2px 7px rgba(28,43,16,.055);-webkit-backdrop-filter:blur(10px) saturate(135%);backdrop-filter:blur(10px) saturate(135%);transition:background .18s,transform .18s,box-shadow .18s}
.notify-btn:hover{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.38));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 12px rgba(28,43,16,.09);transform:translateY(-1px)}
.notify-btn:active{transform:scale(.96)}
.notify-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.notify-btn b{position:absolute;right:-3px;top:-3px;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;border-radius:99px;background:rgba(255,102,51,.9);color:white;font:600 9px/1 Inter,Arial,sans-serif;box-shadow:0 1px 3px rgba(28,43,16,.12);border:1px solid rgba(255,255,255,.8)}
@media(max-width:760px){.top-context{font-size:12px;margin-left:3px}.top-context span,.top-context i{display:none}.top{gap:7px}.notify-btn{width:35px;height:35px}}

/* ===== Homepage aprovada: overview + header sem barra ===== */
#app>main{min-width:0}
.top.top-plain{position:relative;top:auto;z-index:4;display:flex;align-items:center;gap:18px;margin:0;padding:24px 34px 0;min-height:64px;border:0;border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.top-context{display:flex;align-items:center;gap:10px;margin:0;color:var(--mu);font-size:14px}
.top-context .crumb-dot{width:11px;height:11px;border-radius:50%;background:#5f7f43;box-shadow:0 0 0 3px rgba(95,127,67,.10)}
.top-context span:not(.crumb-dot){font-size:15px;font-weight:500;color:var(--tx);letter-spacing:0}
.top-context i{font-style:normal;opacity:.45}
.top-context b{font-size:15px;font-weight:500;color:var(--mu)}
.top-spacer{flex:1}
.system-status{display:flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid rgba(28,43,16,.08);border-radius:99px;background:rgba(255,255,255,.20);color:var(--g);font-size:13px;white-space:nowrap}
.system-status i{width:9px;height:9px;border-radius:50%;background:#5f7f43}
.top .notify-btn{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.72);background:radial-gradient(ellipse at 32% 18%,rgba(255,255,255,.92) 0%,rgba(255,255,255,.58) 19%,rgba(255,255,255,.24) 48%,rgba(255,255,255,.12) 72%),linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.08));color:#30352d;box-shadow:inset 0 1.5px 2px rgba(255,255,255,.95),inset 0 -5px 10px rgba(80,92,66,.06),0 7px 20px rgba(28,43,16,.09),0 1px 3px rgba(28,43,16,.04);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);transition:background .35s cubic-bezier(.2,.8,.2,1),color .3s,box-shadow .35s,transform .35s}
.top .notify-btn:before{content:"";position:absolute;inset:3px 5px 52% 5px;border-radius:50% 50% 42% 42%;background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.04));pointer-events:none;filter:blur(.2px)}
.top .notify-btn svg{position:relative;width:21px;height:21px;stroke-width:1.65;opacity:.88}
.top .notify-btn:hover{background:radial-gradient(ellipse at 32% 18%,rgba(255,255,255,.3),rgba(255,255,255,.04) 45%),linear-gradient(145deg,#2f4420,#1c2b10);color:#fff;border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 2px rgba(255,255,255,.22),inset 0 -5px 12px rgba(0,0,0,.12),0 8px 24px rgba(28,43,16,.22);transform:translateY(-2px)}
.top .notify-btn:hover svg{stroke:#fff}
.top .notify-btn:active{transform:scale(.96)}
.top .notify-btn b{right:-1px;top:-1px;min-width:19px;height:19px;border-radius:50%;font-size:10px}
.top .top-user{width:54px;height:54px;padding:0;overflow:hidden;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:linear-gradient(145deg,#e8eadc,#d9ddcc);color:#1c2b10;font-size:18px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 14px rgba(28,43,16,.08)}
.top .top-user img{display:block;width:100%;height:100%;object-fit:cover}
#sd .nav .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.overview{max-width:1500px;margin:0 auto;padding:34px 34px 50px}
.overview-heading{margin:8px 0 26px}
.overview-heading h1{font-size:52px;line-height:1.12;font-weight:600;letter-spacing:-.045em;color:var(--tx)}
.overview-heading p{font-size:23px;line-height:1.35;color:var(--mu);margin:12px 0 0;letter-spacing:-.02em}
.overview-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:0 0 34px}
.metric-card{position:relative;overflow:hidden;min-height:224px;padding:20px 22px;border:1px solid rgba(120,125,100,.18);border-radius:22px;background:rgba(255,255,255,.34);box-shadow:0 5px 16px rgba(28,43,16,.035),inset 0 1px 0 rgba(255,255,255,.65);display:flex;flex-direction:column;align-items:flex-start}
.metric-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(223,228,210,.82),rgba(207,214,192,.56));color:var(--g);margin-bottom:12px}
.metric-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.metric-card>strong{font-size:37px;line-height:1.08;letter-spacing:-.04em;font-weight:600;color:var(--tx)}
.metric-card>span{font-size:16px;color:var(--mu);margin-top:3px}
.metric-card>small{position:relative;z-index:1;margin-top:12px;padding:4px 10px;border-radius:99px;background:rgba(95,127,67,.10);color:var(--g);font-size:12px;font-weight:600}
.metric-card>small.orange{background:rgba(255,102,51,.12);color:#9b4c22}
.metric-card>small i{font-style:normal;font-size:14px}
.metric-spark{position:absolute;right:0;bottom:0;width:52%;height:68px;overflow:visible}
.metric-spark path:first-child{stroke:#8fa874;stroke-width:1.5;fill:none}
.metric-card:last-child .metric-spark path:first-child{stroke:#ff8a36}
.metric-spark .spark-fill{fill:url(#unused);opacity:.06;stroke:none}
.overview-activity{border:1px solid rgba(120,125,100,.18);border-radius:22px;background:rgba(255,255,255,.28);padding:22px 26px 8px;box-shadow:0 5px 18px rgba(28,43,16,.035),inset 0 1px 0 rgba(255,255,255,.6)}
.activity-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 15px;border-bottom:1px solid var(--ln)}
.activity-heading h2{font-size:21px;font-weight:600;letter-spacing:-.025em;padding-left:15px;position:relative}
.activity-heading h2:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:5px;background:var(--g)}
.activity-heading button{border:0;background:none;color:var(--mu);font:inherit;cursor:pointer}
.activity-heading button span{font-size:20px;margin-left:9px;color:var(--tx)}
.activity-row{display:flex;align-items:center;gap:16px;min-height:66px;border-bottom:1px solid rgba(120,125,100,.13)}
.activity-row:last-child{border-bottom:0}
.activity-icon{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#e8ebdf,#dce2d1);color:var(--g)}
.activity-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.activity-copy{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.activity-copy b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-copy small{font-size:13px;color:var(--mu)}
.activity-row time{font-size:13px;color:var(--mu);white-space:nowrap}
.activity-dot{width:10px;height:10px;border-radius:50%;background:#5f7f43;flex:none;margin-left:7px}
.activity-dot.orange{background:#f36b2b}
@media(max-width:1120px){.overview-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-heading h1{font-size:44px}}
@media(max-width:760px){
 .top.top-plain{padding:16px 16px 0;min-height:58px;gap:9px}
 .top-context{gap:7px}.top-context span:not(.crumb-dot),.top-context i{display:none}
 .system-status{display:none}
 .top .notify-btn,.top .top-user{width:42px;height:42px}
 .overview{padding:25px 16px 34px}
 .overview-heading{margin:4px 0 20px}
 .overview-heading h1{font-size:36px}
 .overview-heading p{font-size:18px}
 .overview-metrics{gap:10px;margin-bottom:20px}
 .metric-card{min-height:180px;padding:14px;border-radius:18px}
 .metric-icon{width:45px;height:45px;margin-bottom:10px}
 .metric-icon svg{width:23px;height:23px}
 .metric-card>strong{font-size:30px}
 .metric-card>span{font-size:13px}
 .metric-card>small{font-size:10px;padding:3px 7px}
 .overview-activity{padding:16px 14px 4px;border-radius:18px}
 .activity-heading h2{font-size:17px}
 .activity-row{gap:9px;min-height:62px}
 .activity-icon{width:36px;height:36px}
 .activity-copy b{font-size:12px}
 .activity-copy small,.activity-row time{font-size:10px}
 .activity-dot{width:8px;height:8px;margin-left:0}
}

/* Tabela editorial responsiva: colunas preservadas, rolagem horizontal quando necessário */
.client-table-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;overscroll-behavior-inline:contain;border-radius:12px;scrollbar-width:thin}
.client-content-table{width:100%;min-width:860px;border-collapse:separate;border-spacing:0}
.client-content-table th,.client-content-table td{white-space:nowrap}
.client-content-table td:nth-child(2){min-width:155px}
.client-content-table td:nth-child(3){min-width:150px}
.client-content-table td:nth-child(4){min-width:130px}
.client-content-table td:nth-child(5){min-width:190px}
.client-content-table td:nth-child(6){min-width:155px}
.client-content-table .pill{max-width:none;flex-shrink:0;white-space:nowrap}
.client-content-table .pill.st{min-width:max-content}
.pop{box-sizing:border-box;width:max-content;min-width:min(210px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow-x:hidden;overflow-y:auto}
@media(max-width:900px){.client-content-table{min-width:860px}}

/* Genie glass responsivo para formatos, status e data de publicação */
.pop.genie-pop{display:flex;flex-direction:column;gap:5px;width:248px;min-width:0;max-width:calc(100vw - 20px);padding:7px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42) 48%,rgba(235,239,226,.48));border:1px solid rgba(255,255,255,.82);box-shadow:0 18px 46px rgba(28,43,16,.17),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(95,127,67,.08);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);overflow:hidden;will-change:transform}
.pop-options{display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(95,127,67,.28) transparent}
.pop.genie-pop .opt{appearance:none;display:flex;align-items:center;width:100%;min-height:32px;padding:3px 5px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer;transition:background .24s cubic-bezier(.2,.8,.2,1),transform .24s,box-shadow .24s}

/* ===== Documentos: biblioteca em pastas editáveis ===== */
const DOC_KEY='akaz-documents-v2';
let docStore=(()=>{try{const x=JSON.parse(localStorage.getItem(DOC_KEY)||'null');if(x&&Array.isArray(x.folders)&&Array.isArray(x.files))return x}catch(e){}return {folders:[{id:'contracts',name:'Contratos',tone:'#dce5d2'},{id:'brand-guides',name:'Manuais de marca',tone:'#e8e1d4'},{id:'proposals',name:'Propostas',tone:'#e8ddd5'},{id:'final-art',name:'Artes finais',tone:'#dce3e7'}],files:[{id:'d1',name:'Contrato — Casa Marrocos',folder:'contracts',client:'marrocos',date:'19 nov 2026',note:'Documento de exemplo'},{id:'d2',name:'Manual de marca v2',folder:'brand-guides',client:'mariana',date:'19 nov 2026',note:'Documento de exemplo'},{id:'d3',name:'Proposta comercial',folder:'proposals',client:'aurora',date:'19 nov 2026',note:'Documento de exemplo'}]}})();
function saveDocs(){try{localStorage.setItem(DOC_KEY,JSON.stringify(docStore))}catch(e){alert('Não foi possível salvar. O armazenamento local pode estar cheio. Tente anexar um arquivo menor.')}}
const docEsc=s=>esc(s==null?'':s),docFolder=id=>docStore.folders.find(f=>f.id===id),docClient=id=>clients.find(c=>c.id===id)?.n||'Sem cliente';
function docFileCard(f){const folder=docFolder(f.folder);return `<article class="doc-file"><div class="doc-file-icon">${f.data?'↧':f.url?'↗':'PDF'}</div><div class="doc-file-main"><button class="doc-open" data-doc-open="${f.id}">${docEsc(f.name)}</button><span>${docEsc(docClient(f.client))} · ${docEsc(folder?.name||'Sem pasta')}</span><small>${docEsc(f.date||'')}</small></div><div class="doc-file-actions">${f.data?`<a class="btn" href="${f.data}" download="${docEsc(f.filename||f.name)}">Baixar</a>`:f.url?`<a class="btn" href="${docEsc(f.url)}" target="_blank" rel="noopener">Abrir ↗</a>`:''}<button class="btn" data-doc-edit="${f.id}" title="Editar">Editar</button><button class="btn" data-doc-del="${f.id}" title="Excluir">×</button></div></article>`}
V.docs=(r=[])=>{const sub=r[1],folder=docFolder(sub),file=docStore.files.find(f=>f.id===sub);if(file){return `<div class="doc-head"><div><button class="doc-back" data-go="docs">← Documentos</button><p class="mu sm">DETALHES DO ARQUIVO</p><h1>${docEsc(file.name)}</h1><p class="mu">${docEsc(docClient(file.client))} · ${docEsc(docFolder(file.folder)?.name||'')}</p></div><button class="btn p" data-doc-edit="${file.id}">Editar informações</button></div><section class="doc-detail"><div class="doc-detail-icon">${file.data?'↧':'▤'}</div><div><h2>${docEsc(file.name)}</h2><p>${docEsc(file.note||'Sem descrição.')}</p><p class="mu sm">Adicionado em ${docEsc(file.date||'—')}</p>${file.data?`<a class="btn p" href="${file.data}" download="${docEsc(file.filename||file.name)}">Baixar arquivo</a>`:file.url?`<a class="btn p" href="${docEsc(file.url)}" target="_blank" rel="noopener">Abrir link externo ↗</a>`:'<span class="mu sm">Este item é apenas um registro de exemplo. Edite para anexar um arquivo ou link.</span>'}</div></section>`}
if(folder){const files=docStore.files.filter(f=>f.folder===folder.id);return `<div class="doc-head"><div><button class="doc-back" data-go="docs">← Todas as pastas</button><p class="mu sm">BIBLIOTECA AKAZ / DOCUMENTOS</p><h1>${docEsc(folder.name)}</h1><p class="mu">${files.length} ${files.length===1?'arquivo':'arquivos'} nesta pasta</p></div><div class="doc-head-actions"><button class="btn" data-doc-rename-folder="${folder.id}">Renomear pasta</button><button class="btn p" data-doc-upload="${folder.id}">+ Adicionar arquivo</button></div></div><div class="doc-toolbar"><span class="mu sm">Arquivos desta pasta</span><button class="btn" data-doc-link="${folder.id}">Adicionar link</button></div><div class="doc-file-list">${files.map(docFileCard).join('')||'<div class="doc-empty"><span>⌑</span><b>Esta pasta ainda está vazia</b><p>Adicione um arquivo ou um link para começar sua biblioteca.</p></div>'}</div>`}
return `<div class="doc-intro"><div><p class="mu sm" style="letter-spacing:.12em">ARQUIVO AKAZ / BIBLIOTECA</p><h1>Documentos</h1><p class="mu">Um lugar para reunir contratos, apresentações, manuais e materiais finais de cada cliente.</p></div><button class="btn p" data-doc-new-folder>+ Nova pasta</button></div><div class="doc-summary"><span><b>${docStore.folders.length}</b> pastas</span><span><b>${docStore.files.length}</b> arquivos</span><span><b>${clients.length}</b> clientes</span></div><div class="doc-folder-grid">${docStore.folders.map((f,i)=>{const n=docStore.files.filter(x=>x.folder===f.id).length;return `<button class="doc-folder" data-go="docs-${f.id}" style="--folder-tone:${f.tone||'#e3e5dc'}"><span class="doc-folder-art"><i></i><i></i><b>⌑</b></span><span class="doc-folder-copy"><b>${docEsc(f.name)}</b><small>${n} ${n===1?'arquivo':'arquivos'}</small></span><span class="doc-folder-arrow">↗</span></button>`}).join('')}<button class="doc-add-folder" data-doc-new-folder><span>＋</span><b>Criar nova pasta</b><small>Organize por tipo ou projeto</small></button></div><div class="doc-latest"><div class="doc-latest-head"><div><h2>Adicionados recentemente</h2><p class="mu sm">Acesse rapidamente os últimos documentos.</p></div></div><div class="doc-file-list">${docStore.files.slice().reverse().slice(0,5).map(docFileCard).join('')||'<div class="doc-empty">Nenhum documento adicionado ainda.</div>'}</div></div><p class="doc-footnote">Os arquivos anexados nesta versão ficam salvos neste navegador. Para compartilhar entre dispositivos e usuários, será necessário conectar o armazenamento na nuvem.</p>`};
function docPromptEdit(id){const f=docStore.files.find(x=>x.id===id);if(!f)return;const name=prompt('Nome do documento:',f.name);if(name===null)return;const note=prompt('Descrição (opcional):',f.note||'');if(note===null)return;const client=prompt('Cliente (digite o nome exatamente como aparece na lista):',docClient(f.client));if(client===null)return;const c=clients.find(x=>x.n.toLowerCase()===client.trim().toLowerCase());f.name=name.trim()||f.name;f.note=note.trim();if(c)f.client=c.id;saveDocs();paint()}
function docUpload(folderId){const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='*/*';inp.onchange=async()=>{for(const file of [...inp.files]){if(file.size>3*1024*1024){alert('“'+file.name+'” ultrapassa 3 MB. Nesta versão, anexe arquivos menores.');continue}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});docStore.files.push({id:'df'+Date.now()+Math.random().toString(16).slice(2,6),name:file.name.replace(/\.[^.]+$/,''),filename:file.name,folder:folderId,client:'',date:new Date().toLocaleDateString('pt-BR'),note:'',data,mime:file.type})}saveDocs();paint()};inp.click()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-doc-new-folder],[data-doc-upload],[data-doc-link],[data-doc-edit],[data-doc-del],[data-doc-rename-folder],[data-doc-open]');if(!t)return;e.preventDefault();e.stopPropagation();if(t.dataset.docOpen){location.hash='docs-'+t.dataset.docOpen;return}if(t.hasAttribute('data-doc-new-folder')){const name=prompt('Nome da nova pasta:');if(!name?.trim())return;docStore.folders.push({id:'folder'+Date.now(),name:name.trim(),tone:['#e4e8dc','#eee3d9','#e2e8eb','#eee8d7'][docStore.folders.length%4]});saveDocs();paint();return}if(t.dataset.docUpload){docUpload(t.dataset.docUpload);return}if(t.dataset.docLink){const name=prompt('Nome do link ou documento:');if(!name?.trim())return;const url=prompt('Cole o endereço completo (https://):');if(!url?.trim())return;const clientName=prompt('Cliente (opcional):','');const c=clients.find(x=>x.n.toLowerCase()===String(clientName||'').trim().toLowerCase());docStore.files.push({id:'dl'+Date.now(),name:name.trim(),url:url.trim(),folder:t.dataset.docLink,client:c?.id||'',date:new Date().toLocaleDateString('pt-BR'),note:'Link externo'});saveDocs();paint();return}if(t.dataset.docEdit){docPromptEdit(t.dataset.docEdit);return}if(t.dataset.docDel){if(!confirm('Excluir este documento?'))return;docStore.files=docStore.files.filter(f=>f.id!==t.dataset.docDel);saveDocs();paint();return}if(t.dataset.docRenameFolder){const f=docFolder(t.dataset.docRenameFolder);const name=prompt('Novo nome da pasta:',f?.name||'');if(!name?.trim())return;f.name=name.trim();saveDocs();paint()}});

const IC=[['Gastronomia','🍽️ 🍕 🍔 🍣 🥐 🍰 ☕ 🍷 🍺 🥗 🍦'],['Moda e beleza','👗 👠 👜 🕶️ 💄 💅 💇 ✂️ 💍 💎 🧴'],['Saúde e bem-estar','🩺 🦷 💊 🧠 🧘 🏋️ 🥦 🧬 👁️ 🐶 🐱'],['Viagens e turismo','✈️ 🧳 🏝️ 🗺️ 🏨 ⛵ 🚌 🏔️ 🌴 📍 🎫'],['Casa e negócios','🏠 🔑 🏗️ 🛠️ 🛋️ 🌿 🌸 🚗 ⚖️ 💼 💰'],['Tecnologia e criação','💻 📱 🤖 🎓 📚 📸 🎨 🎬 🎵 🎉 ⭐']];
const DF=[[/gastr|restaur|comida|caf[eé]|\bbar\b|padar|doce|pizza|hamb/i,'🍽️','laranja'],[/moda|roupa|vestu|bou?tique|joia/i,'👗','rosa'],[/sa[uú]de|cl[ií]nica|m[eé]dic|odont|dent|nutri|psic/i,'🩺','petróleo'],[/viage|turism|hotel|pousada/i,'✈️','azul'],[/beleza|est[eé]tica|sal[aã]o|cabel|barbear/i,'💅','rosa'],[/fitness|academia|esporte|treino|pilates/i,'🏋️','laranja'],[/im[oó]vel|imobili|constru|arquitet|decora/i,'🏠','areia'],[/tecnolog|software|sistema|digital/i,'💻','roxo'],[/educa|escola|curso|ensino|idioma/i,'🎓','azul'],[/\bpet|veterin|animal/i,'🐶','areia'],[/jur[ií]d|advoc|contab|financ/i,'⚖️','grafite'],[/foto|arte|design|cria|v[ií]deo/i,'📸','roxo'],[/evento|festa|casamento/i,'🎉','rosa']];
const icGet=c=>{const d=DF.find(x=>x[0].test(c.seg||''))||[],i=c.ic||{};return{g:i.g||d[1]||'▣',k:i.k||d[2]||'verde'}};
function icTile(c,sm){const i=icGet(c),rgb=(CL.find(x=>x[0]==i.k)||CL[0])[1];return `<button class="bigic${sm?' sm':''}" data-icp="${c.id}" style="--ic:${rgb}" aria-label="Alterar ícone do cliente" title="Alterar ícone"><span>${esc(i.g||'▣')}</span><i class="icb">✎</i></button>`}
document.addEventListener('click',e=>{const o=e.target.closest('[data-icp],[data-ick],[data-icg],[data-icu]');if(!o)return;e.stopPropagation();
if(o.dataset.icp){
 document.querySelectorAll('.icp').forEach(x=>x.remove());
 const c=clients.find(x=>x.id==o.dataset.icp);if(!c)return;
 const i=icGet(c),d=document.createElement('div');d.className='pop icp';d.dataset.cid=c.id;
 d.style.setProperty('--ic',(CL.find(x=>x[0]==i.k)||CL[0])[1]);
 d.innerHTML=`<div><h4>Cor</h4><div class="icc">${CL.map(([k,v])=>`<button data-ick="${k}" style="--ic:${v}" aria-label="${k}" title="${k}" class="${(i.k||'verde')==k?'on':''}"></button>`).join('')}</div></div>${IC.map(([t,s])=>`<div><h4>${t}</h4><div class="icg">${s.split(' ').map(g=>`<button data-icg="${g}" class="${i.g==g?'on':''}">${g}</button>`).join('')}</div></div>`).join('')}<div><h4>Outro emoji</h4><div style="display:flex;gap:8px"><input class="icin" maxlength="12" placeholder="Digite ou cole um emoji" aria-label="Outro emoji"><button class="btn" data-icu="1">Usar</button></div></div>`;
 document.body.append(d);
 const placeIconPicker=()=>{
   if(!d.isConnected||!o.isConnected)return;
   const vv=window.visualViewport;
   const vw=Math.max(1,Math.floor(vv?.width||document.documentElement.clientWidth||innerWidth));
   const vh=Math.max(1,Math.floor(vv?.height||document.documentElement.clientHeight||innerHeight));
   const ox=Math.max(0,Math.floor(vv?.offsetLeft||0)),oy=Math.max(0,Math.floor(vv?.offsetTop||0));
   const margin=8,gap=7,r=o.getBoundingClientRect();
   const width=Math.min(332,Math.max(220,vw-margin*2));
   const left=Math.max(ox+margin,Math.min(r.left,ox+vw-width-margin));
   const top=Math.max(oy+margin,r.bottom+gap);
   const available=Math.max(116,oy+vh-top-margin);
   d.style.width=width+'px';
   d.style.left=left+'px';
   d.style.top=top+'px';
   d.style.setProperty('--icp-max-h',Math.min(360,available)+'px');
   d.style.maxHeight=Math.min(360,available)+'px';
   d.style.overflowY='auto';
 };
 requestAnimationFrame(placeIconPicker);
 d._placeIconPicker=placeIconPicker;
 return;
}
const d=o.closest('.icp'),c=d&&clients.find(x=>x.id==d.dataset.cid);if(!c)return;c.ic=icGet(c);let fin=0;
if(o.dataset.ick){c.ic.k=o.dataset.ick;d.style.setProperty('--ic',(CL.find(x=>x[0]==c.ic.k)||CL[0])[1]);d.querySelectorAll('[data-ick]').forEach(b=>b.classList.toggle('on',b==o))}
else{let g=o.dataset.icg;if(o.dataset.icu){const v=d.querySelector('.icin').value.trim();if(!v)return;g=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(v)][0].segment:v}c.ic.g=g;fin=1}
document.querySelectorAll('.bigic[data-icp="'+c.id+'"]').forEach(b=>b.outerHTML=icTile(c,b.classList.contains('sm')));save();if(fin)d.remove()},true);
window.addEventListener('resize',()=>document.querySelector('.icp')?._placeIconPicker?.());
window.visualViewport?.addEventListener('resize',()=>document.querySelector('.icp')?._placeIconPicker?.());
window.visualViewport?.addEventListener('scroll',()=>document.querySelector('.icp')?._placeIconPicker?.());
window.addEventListener('scroll',()=>document.querySelector('.icp')?._placeIconPicker?.(),true);
addEventListener('hashchange',paint);paint();

/* ===== Botões de janela estilo macOS ===== */
(()=>{const D=document,H=D.documentElement,B=D.body;
const LT=(o={})=>`<span class="wlg" role="group" aria-label="Controles da janela">${[['r','x','Fechar','×'],['y','m','Minimizar','−'],['g','z','Ampliar','+']].map(([c,a,t,g])=>`<button class="wlb ${c}" data-wl="${a}" aria-label="${t}" title="${t}"${o[a]===0?' disabled':''}><b aria-hidden="true">${g}</b><em>${t}</em></button>`).join('')}</span>`;
B.insertAdjacentHTML('beforeend',`<div id="wlw">${LT()}</div>`);
const T={x:'Sair do workspace',m:'Recolher menu lateral',z:'Modo foco (Esc para sair)'};
const S={x:'Sair',m:'Recolher',z:'Foco'};D.querySelectorAll('#wlw [data-wl]').forEach(b=>{b.title=T[b.dataset.wl];b.setAttribute('aria-label',T[b.dataset.wl]);b.querySelector('em').textContent=S[b.dataset.wl]});
const rt=()=>{H.dataset.route=(location.hash||'#login').slice(1).split('-')[0]};rt();addEventListener('hashchange',rt);
const sync=()=>{const f=!!H.dataset.focus;D.querySelector('#wlw [data-wl=m]').setAttribute('aria-pressed',f||H.dataset.sb=='off');D.querySelector('#wlw [data-wl=z]').setAttribute('aria-pressed',f)};
const SB=v=>{if(v)H.dataset.sb='off';else delete H.dataset.sb;try{localStorage.setItem('akaz-sb',v?'1':'')}catch(e){}};
try{if(localStorage.getItem('akaz-sb'))H.dataset.sb='off'}catch(e){}sync();
function askOut(){closeMod();const d=D.createElement('div');d.className='mod';d.innerHTML=`<div class="mc" role="alertdialog" aria-modal="true" aria-labelledby="mtt"><h2 id="mtt">Sair do workspace?</h2><p class="mq" style="margin:0">Suas alterações ficam salvas neste navegador.</p><div class="ma"><button class="btn" data-mc="1">Cancelar</button><button class="btn p" data-lo="1">Sair</button></div></div>`;B.append(d)}
function minMod(mod){const mc=mod.querySelector('.mc');if(!mc||mod.dataset.min)return;
const c=D.createElement('button');c.className='wlchip';c.id='wlchip';c.innerHTML=`<i></i>${esc(mod.querySelector('h2').textContent)} <small>restaurar ▴</small>`;B.append(c);
const r=c.getBoundingClientRect(),ar={x:r.left+r.width/2,y:r.top+r.height/2};mod.dataset.min=1;
genie(mc,'close',ar,()=>{mod.style.display='none'});
c.onclick=()=>{c.remove();mc.getAnimations().forEach(a=>a.cancel());mod.style.display='';delete mod.dataset.min;genie(mc,'open',ar)}}
D.addEventListener('click',e=>{
if(e.target.closest('[data-lo]')){e.stopPropagation();closeMod();location.hash='login';return}
if(e.target.closest('#tg')&&innerWidth>760){SB(H.dataset.sb!='off');sync()}
const b=e.target.closest('[data-wl]');if(!b||b.disabled)return;e.stopPropagation();
const a=b.dataset.wl,mod=b.closest('.mod');
if(mod){if(a=='x')closeMod();else if(a=='m')minMod(mod);else mod.querySelector('.mc').classList.toggle('wlbig');return}
if(a=='x')askOut();
else if(a=='m'){if(H.dataset.focus)delete H.dataset.focus;else SB(H.dataset.sb!='off')}
else{if(H.dataset.focus)delete H.dataset.focus;else{H.dataset.focus='1';toast('Modo foco ativado. Clique no verde ou aperte Esc para sair.')}}
sync()},true);
D.addEventListener('keydown',e=>{if(e.key=='Escape'&&H.dataset.focus&&!D.querySelector('.mod')){delete H.dataset.focus;sync()}});
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!=1||!n.classList.contains('mod')||n.querySelector('.wlg'))continue;const mc=n.querySelector('.mc');if(!mc)continue;mc.insertAdjacentHTML('afterbegin',LT(mc.getAttribute('role')=='alertdialog'?{m:0,z:0}:{}))}
const c=D.getElementById('wlchip');if(c&&!D.querySelector('.mod[data-min]'))c.remove()}).observe(B,{childList:true});
})();

document.addEventListener('input',e=>{
 if(e.target.id==='sideSearch'){
  const q=e.target.value.trim().toLocaleLowerCase('pt-BR');let shown=0;
  document.querySelectorAll('#sideNavGroups .nav[data-side-label]').forEach(el=>{const ok=!q||el.dataset.sideLabel.includes(q);el.style.display=ok?'flex':'none';if(ok)shown++});
  document.querySelectorAll('#sideNavGroups .grp').forEach(group=>{let next=group.nextElementSibling,has=false;while(next&&!next.classList.contains('grp')){if(next.classList.contains('nav')&&next.style.display!=='none')has=true;next=next.nextElementSibling}group.style.display=has?'block':'none'});
  const empty=$('#sideEmpty');if(empty)empty.style.display=shown?'none':'block';
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='profilePhotoInput'&&e.target.files?.[0]){
  const file=e.target.files[0];if(!file.type.startsWith('image/')){alert('Escolha um arquivo de imagem.');return}
  if(file.size>1500000){alert('Escolha uma imagem de até 1,5 MB.');return}
  const reader=new FileReader();reader.onload=()=>{akazProfilePhoto=reader.result;try{localStorage.setItem('akaz_profile_photo',akazProfilePhoto)}catch(err){alert('Não foi possível salvar a foto neste navegador.')}paint()};reader.readAsDataURL(file);
 }
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#sideSearch')?.focus()}});

/* Mobile drawer: fechar ao tocar fora e ao pressionar Escape. */
document.addEventListener('click',e=>{
 const sd=document.querySelector('#sd');
 if(sd?.classList.contains('open')&&!e.target.closest('#sd,#tg')){
  sd.classList.remove('open');
  document.querySelector('#tg')?.setAttribute('aria-expanded','false');
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  const sd=document.querySelector('#sd');
  if(sd?.classList.contains('open')){
   sd.classList.remove('open');
   document.querySelector('#tg')?.setAttribute('aria-expanded','false');

 }

</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="./supabase-config.js"></script>
<script>
(() => {
  const cfg = window.AKAZ_SUPABASE_CONFIG;
  const client = window.supabase?.createClient && cfg?.url && cfg?.publishableKey
    ? window.supabase.createClient(cfg.url, cfg.publishableKey)
    : null;
  let ready = false;
  let signedInUser = null;
  let workspaceMembership = null;
  let clientsSyncReady = false;
  let clientsSyncTimer = null;
  let clientsSyncBusy = false;
  let clientsSyncQueued = false;
  let clientsSyncErrorShown = false;

  const clientFields = new Set(['id','n','r','seg','st','ig','e','t']);
  function toDbClient(c) {
    const metadata = {};
    Object.keys(c || {}).forEach(k => { if (!clientFields.has(k)) metadata[k] = c[k]; });
    const status = String(c.st || 'Ativo').toLowerCase();
    return {
      id: c.id,
      workspace_id: workspaceMembership.workspace_id,
      name: String(c.n || 'Cliente sem nome').trim(),
      contact_name: c.r && c.r !== '—' ? String(c.r) : null,
      email: c.e || null,
      segment: c.seg && c.seg !== '—' ? String(c.seg) : null,
      status: /inativ|pausad/.test(status) ? 'inactive' : /onboard|prepara/.test(status) ? 'onboarding' : 'active',
      instagram: c.ig && c.ig !== '—' ? String(c.ig) : null,
      notes: c.t || null,
      metadata
    };
  }
  function fromDbClient(row) {
    const meta = row.metadata && typeof row.metadata === 'object' ? row.metadata : {};
    return {
      ...meta,
      id: row.id,
      n: row.name || 'Cliente sem nome',
      r: row.contact_name || '—',
      e: row.email || '',
      seg: row.segment || '—',
      st: row.status === 'inactive' ? 'Inativo' : row.status === 'onboarding' ? 'Onboarding' : 'Ativo',
      ig: row.instagram || '—',
      t: row.notes || ''
    };
  }
  function remapLocalClientReferences(oldToNew) {
    try {
      const raw = JSON.parse(localStorage.getItem('akaz1') || 'null');
      if (!raw) return;
      (raw.posts || []).forEach(x => { if (oldToNew[x.c]) x.c = oldToNew[x.c]; });
      (raw.projects || []).forEach(x => { if (oldToNew[x.c]) x.c = oldToNew[x.c]; });
      localStorage.setItem('akaz1', JSON.stringify(raw));
    } catch (e) { console.warn('Não foi possível atualizar referências locais:', e); }
  }
  async function loadOrMigrateClients() {
    const { data: rows, error } = await client.from('clients')
      .select('*').eq('workspace_id', workspaceMembership.workspace_id)
      .order('created_at', { ascending: true });
    if (error) throw new Error('Falha ao carregar clientes da nuvem: ' + error.message);

    if (rows && rows.length) {
      const cloudClients = rows.map(fromDbClient);
      if (typeof clients !== 'undefined') clients.splice(0, clients.length, ...cloudClients);
      localStorage.setItem('akaz1', JSON.stringify({
        clients: cloudClients,
        posts: JSON.parse(localStorage.getItem('akaz1') || '{}').posts || [],
        pages: JSON.parse(localStorage.getItem('akaz1') || '{}').pages || [],
        notes: JSON.parse(localStorage.getItem('akaz1') || '{}').notes || [],
        comments: JSON.parse(localStorage.getItem('akaz1') || '{}').comments || [],
        ST, FM, COL, projects
      }));
      return;
    }

    // Primeira migração: preserva os cadastros locais existentes e envia para o workspace.
    const raw = JSON.parse(localStorage.getItem('akaz1') || 'null');
    const localClients = raw && Array.isArray(raw.clients) ? raw.clients : (typeof clients !== 'undefined' ? [...clients] : []);
    if (!localClients.length) return;
    const oldToNew = {};
    const prepared = localClients.map(c => {
      const oldId = String(c.id || '');
      const newId = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(oldId)
        ? oldId : crypto.randomUUID();
      if (oldId) oldToNew[oldId] = newId;
      return toDbClient({ ...c, id: newId });
    });
    const { data: inserted, error: insertError } = await client.from('clients')
      .insert(prepared).select('*');
    if (insertError) throw new Error('Falha ao migrar clientes locais: ' + insertError.message);
    const cloudClients = (inserted || []).map(fromDbClient);
    if (typeof clients !== 'undefined') clients.splice(0, clients.length, ...cloudClients);
    remapLocalClientReferences(oldToNew);
    const current = JSON.parse(localStorage.getItem('akaz1') || '{}');
    current.clients = cloudClients;
    localStorage.setItem('akaz1', JSON.stringify(current));
  }
  async function persistClientsNow(list) {
    if (!clientsSyncReady || !workspaceMembership || !Array.isArray(list)) return;
    if (clientsSyncBusy) { clientsSyncQueued = true; return; }
    clientsSyncBusy = true;
    try {
      const payload = list.map(c => {
        if (!c.id || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(c.id))) {
          c.id = crypto.randomUUID();
        }
        return toDbClient(c);
      });
      const { error } = await client.from('clients').upsert(payload, { onConflict: 'id' });
      if (error) throw error;
      clientsSyncErrorShown = false;
    } catch (err) {
      console.error('AKAZ clients sync:', err);
      if (!clientsSyncErrorShown) {
        clientsSyncErrorShown = true;
        const toast = document.getElementById('toast');
        if (toast) { toast.textContent = 'Não foi possível sincronizar clientes: ' + (err.message || 'erro desconhecido'); toast.classList.remove('hidden'); }
        else alert('Não foi possível sincronizar os clientes com a nuvem: ' + (err.message || 'erro desconhecido'));
      }
    } finally {
      clientsSyncBusy = false;
      if (clientsSyncQueued) { clientsSyncQueued = false; persistClientsNow(list); }
    }
  }
  function scheduleClientsSave(list) {
    if (!clientsSyncReady) return;
    clearTimeout(clientsSyncTimer);
    clientsSyncTimer = setTimeout(() => persistClientsNow(list), 650);
  }
  window.AKAZ_CLIENTS_DB = {
    scheduleSave: scheduleClientsSave,
    async deleteClient(id) {
      if (!client || !clientsSyncReady) return;
      const { error } = await client.from('clients').delete().eq('id', id).eq('workspace_id', workspaceMembership.workspace_id);
      if (error) throw error;
    },
    get ready() { return clientsSyncReady; }
  };

  function showMessage(message) {
    let el = document.getElementById('akaz-auth-message');
    if (!el) {
      el = document.createElement('p');
      el.id = 'akaz-auth-message';
      el.setAttribute('role', 'alert');
      el.style.cssText = 'margin:0;padding:10px 12px;border-radius:10px;background:rgba(255,102,51,.16);color:#fff;font-size:13px;line-height:1.4';
      document.querySelector('.lgx-c')?.appendChild(el);
    }
    el.textContent = message;
  }

  function clearMessage() { document.getElementById('akaz-auth-message')?.remove(); }

  async function validateMembership(user) {
    const { data, error } = await client
      .from('workspace_members')
      .select('workspace_id, role')
      .eq('user_id', user.id)
      .maybeSingle();
    if (error) throw new Error('Não foi possível verificar sua permissão no AKAZ Studio: ' + error.message);
    if (!data || !['owner', 'admin', 'designer'].includes(data.role)) {
      throw new Error('Sua conta ainda não está vinculada à equipe AKAZ. Peça ao administrador para verificar seu acesso.');
    }
    return data;
  }

  let projectsSyncTimer = null;
  let projectCategories = ['Identidade visual','Naming','Design de post'];
  function fromDbProject(row) {
    return { id:row.id, n:row.name, c:row.client_id, cat:row.category || 'Identidade visual', st:row.status || 'Planejamento', iso:row.due_at ? String(row.due_at).slice(0,16) : new Date(Date.now()+12096e5).toISOString().slice(0,16), desc:row.description || '', tasks:Array.isArray(row.tasks)?row.tasks:[] };
  }
  function toDbProject(p) {
    return { id:p.id, workspace_id:workspaceMembership.workspace_id, client_id:p.c || null, name:String(p.n||'Novo projeto').trim(), category:p.cat||'Identidade visual', status:p.st||'Planejamento', description:p.desc||null, due_at:p.iso ? new Date(p.iso).toISOString() : null, tasks:Array.isArray(p.tasks)?p.tasks:[] };
  }
  async function loadProjectsAndCategories() {
    const [pr, cr] = await Promise.all([
      client.from('projects').select('*').eq('workspace_id',workspaceMembership.workspace_id).order('created_at',{ascending:true}),
      client.from('project_categories').select('name').eq('workspace_id',workspaceMembership.workspace_id).order('name',{ascending:true})
    ]);
    if(pr.error) throw new Error('Falha ao carregar projetos: '+pr.error.message);
    if(cr.error) throw new Error('Falha ao carregar categorias: '+cr.error.message);
    projects.splice(0,projects.length,...(pr.data||[]).map(fromDbProject));
    const custom=(cr.data||[]).map(x=>x.name);
    projectCategories=['Identidade visual','Naming','Design de post',...custom.filter(x=>!['Identidade visual','Naming','Design de post'].includes(x))];
    CATS.splice(0,CATS.length,...projectCategories);
    try { const raw=JSON.parse(localStorage.getItem('akaz1')||'{}');raw.projects=projects;localStorage.setItem('akaz1',JSON.stringify(raw)); } catch(e) {}
  }
  async function saveProjectNow(p) {
    if(!ready || !workspaceMembership || !p) return;
    const {error}=await client.from('projects').upsert(toDbProject(p),{onConflict:'id'});
    if(error) throw error;
  }
  function scheduleProjectSave(p) {
    clearTimeout(projectsSyncTimer);
    projectsSyncTimer=setTimeout(()=>saveProjectNow(p).catch(err=>{console.error('AKAZ project sync:',err);alert('Não foi possível sincronizar o projeto: '+err.message)}),500);
  }
  async function addProjectCategory(name) {
    const clean=String(name||'').trim().replace(/\s+/g,' ');
    if(!clean) return null;
    const {data,error}=await client.from('project_categories').insert({workspace_id:workspaceMembership.workspace_id,name:clean}).select('name').single();
    if(error) throw error;
    return data.name;
  }
  window.AKAZ_PROJECTS_DB={
    load:loadProjectsAndCategories, save:saveProjectNow, scheduleSave:scheduleProjectSave,
    async delete(id){const {error}=await client.from('projects').delete().eq('id',id).eq('workspace_id',workspaceMembership.workspace_id);if(error)throw error;},
    addCategory:addProjectCategory
  };

  async function enterWorkspace(session) {
    if (!session?.user) return;
    try {
      const membership = await validateMembership(session.user);
      signedInUser = session.user;
      workspaceMembership = membership;
      await loadOrMigrateClients();
      clientsSyncReady = true;

async function refreshList(){const cdb=db(),mem=membership();if(!cdb||!mem)return;const {data,error}=await cdb.from('akaz_conversations').select('id,workspace_id,client_id,title,created_by,last_message_at,created_at').eq('workspace_id',mem.workspace_id).order('last_message_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});if(error)throw error;const rows=data||[];const ids=rows.map(x=>x.id);let latest={};if(ids.length){const {data:ms,error:me}=await cdb.from('akaz_messages').select('id,conversation_id,body,attachment_name,sender_id,sender_name,created_at').in('conversation_id',ids).order('created_at',{ascending:false});if(me)throw me;for(const m of ms||[])if(!latest[m.conversation_id])latest[m.conversation_id]=m;}conversations=rows.map(c=>({...c,last_message:latest[c.id],unread_count:unreadFlag(c,latest[c.id])}));renderList();if(activeId&&!conversations.some(c=>c.id===activeId)){activeId=null;activeMessages=[];renderMessages();}else if(activeId){renderList();}}

 function showError(err){console.error('AKAZ chat:',err);const host=$('#chat-main');if(host){let el=$('#chat-error',host);if(!el){el=document.createElement('div');el.id='chat-error';el.style.cssText='margin:8px 16px;padding:10px 12px;border-radius:10px;background:rgba(255,102,51,.12);color:var(--tx);font-size:12px';host.prepend(el);}el.textContent='Não foi possível concluir a ação: '+(err?.message||'verifique a conexão e as permissões do Supabase.');}}
 async function selectConversation(id){activeId=id;activeMessages=[];rendered=new Set();Object.values(players).forEach(p=>p.a.pause());markSeen(id);renderMessages();const shell=$('.chat-shell');shell?.classList.add('chat-open');try{await loadMessages(id)}catch(e){showError(e)}}
 async function createConversation(e){e.preventDefault();const cdb=db(),mem=membership(),u=user();if(!cdb||!mem||!u){showError(new Error('Faça login para iniciar uma conversa.'));return;}const clientId=$('#chat-new-client')?.value||null;const title=$('#chat-new-title')?.value.trim()|| (clientId?clientName(clientId):'Conversa da equipe');const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;if(clientId&&!uuid.test(clientId)){showError(new Error('Este cliente ainda não foi sincronizado com o banco de dados. Aguarde a sincronização e tente novamente.'));return;}try{let q=cdb.from('akaz_conversations').insert({workspace_id:mem.workspace_id,client_id:clientId,title,created_by:u.id}).select().single();let {data,error}=await q;if(error&&error.code==='23505'&&clientId){const existing=await cdb.from('akaz_conversations').select('*').eq('workspace_id',mem.workspace_id).eq('client_id',clientId).single();data=existing.data;error=existing.error;}if(error)throw error;$('#chat-new-modal').hidden=true;await refreshList();await selectConversation(data.id);}catch(err){showError(err)}}
 async function sendMessage(e){e?.preventDefault();if(sending)return;const c=current(),cdb=db(),mem=membership(),u=user(),input=$('#chat-message-input');if(!c||!cdb||!mem||!u||!input)return;if(rec&&rec.st==='rec')return;const body=pendingKind==='audio'?'':input.value.trim();if(!body&&!pendingFile)return;sending=true;setSending(true);let path='';try{let attachment={};if(pendingFile){const err=validate(pendingFile,pendingKind||'doc');if(err)throw new Error(err);const safe=pendingFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');path=`${mem.workspace_id}/${c.id}/${crypto.randomUUID()}-${safe}`;const up=await cdb.storage.from(BUCKET).upload(path,pendingFile,{cacheControl:'3600',upsert:false,contentType:pendingFile.type||'application/octet-stream'});if(up.error)throw up.error;attachment={attachment_path:path,attachment_name:pendingFile.name,attachment_type:pendingFile.type||'application/octet-stream',attachment_size:pendingFile.size}}const {error}=await cdb.from('akaz_messages').insert({workspace_id:mem.workspace_id,conversation_id:c.id,sender_id:u.id,sender_name:(typeof akazProfileName!=='undefined'?akazProfileName:u.email)||'Equipe AKAZ',body,...attachment});if(error){if(path)cdb.storage.from(BUCKET).remove([path]);throw error}input.value='';input.style.height='auto';const wasAudio=pendingKind==='audio';clearPending();if(wasAudio)discardRec();await loadMessages(c.id);await refreshList()}catch(err){showError(err)}finally{sending=false;setSending(false)}}

 },true);

const ta=$('#chat-message-input'),pend=$('#chat-pending'),busy=send.classList.contains('busy')||send.disabled,hasPend=!!pend&&!pend.hidden&&pend.children.length>0,has=!!(ta&&ta.value.trim())||hasPend,idle=!has&&!busy;

/* ===== Painel de emojis (nasce do botão; reutiliza genie() da plataforma) ===== */
const EM=[['Rostos','😀 😄 😁 😂 🙂 😉 😊 😍 🥰 😎 🤔 😅 😬 😮 😢 😴'],['Gestos','👍 👎 👏 🙌 🙏 🤝 👌 ✌️ 🤞 💪 👀 👋 🙋 ☝️ ✍️ 🤙'],['Trabalho','✅ ❌ ⚠️ 📌 📎 📅 ⏰ 📝 📊 📈 💡 🎯 🚀 📣 🔔 🔒'],['Símbolos','❤️ 🧡 💚 💙 💜 ⭐ ✨ 🔥 🎉 🎊 💯 ☕ 🌿 🌟 ➕ ➡️']].map(([n,s])=>[n,s.split(' ')]);
let recent=[],tab='';try{recent=JSON.parse(localStorage.getItem(RKEY)||'[]')||[]}catch(e){}
const panel=()=>$('.cgx-emoji');
const ar=b=>{const r=b.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
function tabs(){return(recent.length?[['Recentes',recent]]:[]).concat(EM)}
function renderEmoji(p){const T=tabs();if(!T.some(t=>t[0]===tab))tab=T[0][0];
p.innerHTML=`<div class="cgx-tabs" role="tablist">${T.map(t=>`<button type="button" class="cgx-tab${t[0]===tab?' on':''}" role="tab" aria-selected="${t[0]===tab}" data-cgx-tab="${t[0]}">${t[0]}</button>`).join('')}</div><div class="cgx-grid">${T.find(t=>t[0]===tab)[1].map(e=>`<button type="button" class="cgx-em" data-cgx-em="${e}" aria-label="${e}">${e}</button>`).join('')}</div>`}
function openEmoji(btn){const wrap=$('.chat-composer-wrap');if(!wrap)return;let p=panel();if(!p){p=D.createElement('div');p.className='cgx-emoji';p.hidden=true;p.setAttribute('role','dialog');p.setAttribute('aria-label','Emojis');wrap.append(p)}
p.getAnimations().forEach(a=>a.cancel());renderEmoji(p);p.hidden=false;btn.setAttribute('aria-expanded','true');
if(typeof genie==='function')genie(p,'open',ar(btn),null,520)}
function closeEmoji(){const p=panel();if(!p||p.hidden)return;const b=$('[data-cgx-emoji]');if(b)b.setAttribute('aria-expanded','false');
if(typeof genie==='function'&&b&&!RM())genie(p,'close',ar(b),()=>{p.hidden=true},380);else p.hidden=true}
function pick(e){const ta=$('#chat-message-input');if(!ta)return;const s=ta.selectionStart??ta.value.length,n=ta.selectionEnd??s;ta.setRangeText(e,s,n,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus({preventScroll:true});
recent=[e].concat(recent.filter(x=>x!==e)).slice(0,8);try{localStorage.setItem(RKEY,JSON.stringify(recent))}catch(_){}}

/* ===== Eventos ===== */
// bloqueia ação em botões desabilitados (aria-disabled) antes dos handlers do chat
D.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.cgx-b[aria-disabled="true"]');if(b){e.preventDefault();e.stopImmediatePropagation()}},true);
D.addEventListener('click',e=>{
const b=e.target.closest&&e.target.closest('.cgx-b,.cgx-o');
if(b&&b.getAttribute('aria-disabled')!=='true'&&!RM()){b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');setTimeout(()=>b.classList.remove('pulse'),520)}
if(!e.target.closest)return;
if(e.target.closest('[data-cgx-toggle]')){hideTip();if(X.state==='open'){closeEmoji();closeTray()}else openTray();return}
const em=e.target.closest('[data-cgx-emoji]');if(em){hideTip();const p=panel();if(p&&!p.hidden)closeEmoji();else openEmoji(em);return}
const tb=e.target.closest('[data-cgx-tab]');if(tb){tab=tb.dataset.cgxTab;renderEmoji(panel());return}
const pk=e.target.closest('[data-cgx-em]');if(pk){pick(pk.dataset.cgxEm);return}
if(e.target.closest('[data-chat-img],[data-chat-doc],[data-chat-mic]')){closeEmoji();closeTray();return}
if(e.target.closest('.chat-send')){closeEmoji();closeTray()}
});
// fora do compositor: recolhe com a animação inversa
D.addEventListener('pointerdown',e=>{if(!e.target.closest)return;hideTip();
if(X.state==='open'&&!e.target.closest('.cgx'))closeTray();
const p=panel();if(p&&!p.hidden&&!e.target.closest('.cgx-emoji,[data-cgx-emoji]'))closeEmoji()},true);
D.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const p=panel();if(p&&!p.hidden){closeEmoji();$('[data-cgx-emoji]')?.focus();return}if(X.state==='open'){closeTray();$('.cgx-o')?.focus()}hideTip()});
// digitar recolhe a bandeja; qualquer mudança reavalia os estados
D.addEventListener('input',e=>{if(e.target&&e.target.id==='chat-message-input'){if(e.isTrusted&&X.state==='open')closeTray();later()}});
D.addEventListener('change',()=>later());
D.addEventListener('submit',()=>{closeEmoji();later();setTimeout(later,60)},true);
const root0=D.getElementById('root')||D.body;
new MutationObserver(()=>{if($('.cgx')||tipEl)later()}).observe(root0,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','disabled']});

/* ===== Configurações > Controles do chat (reutiliza .cfs/.cfr/.swb) ===== */
const SWL=()=>typeof SW!=='undefined'?SW:['#5f7f43','#28643c','#d6a53c','#ff6633','#966ec8','#c8647a','#828778','#8a6a4a'];
const cur=k=>tones[k]||SHOW[k];
function section(){
const prev=Object.keys(DEF).map(k=>`<button type="button" class="cgx-b" data-tone="${k}" data-tip="${LBL[k][0]}" tabindex="-1" aria-label="${LBL[k][0]}">${IC[k]}</button>`).join('');
const rows=Object.keys(DEF).map(k=>`<div class="cfr"><div style="flex:1;min-width:200px"><b>${LBL[k][0]}</b><div class="mu sm">Padrão: ${LBL[k][1].toLowerCase()}</div></div><span class="cgx-sws" data-cgx-row="${k}">${SWL().map(h=>`<button type="button" class="swb${cur(k).toLowerCase()===h.toLowerCase()?' on':''}" style="background:${h}" data-cgx-sw="${k}|${h}" aria-label="Cor ${h}"></button>`).join('')}<input type="color" value="${cur(k)}" data-cgx-cc="${k}" aria-label="Cor personalizada de ${LBL[k][0].toLowerCase()}" style="width:30px;height:26px;border:0;background:none;padding:0;cursor:pointer"></span><button type="button" class="btn" data-cgx-reset="${k}">Padrão</button></div>`).join('');
return`<section class="cfs"><h3>Controles do chat</h3><p class="mu sm" style="margin:0 0 6px">Cada ação do compositor tem a sua cor. Elas seguem o tema claro e escuro e ficam salvas neste navegador.</p><div class="cgx-prev" aria-hidden="true">${prev}</div>${rows}</section>\n`}
function syncSettings(){D.querySelectorAll('[data-cgx-row]').forEach(r=>{const k=r.dataset.cgxRow,c=cur(k).toLowerCase();r.querySelectorAll('.swb').forEach(s=>s.classList.toggle('on',s.dataset.cgxSw.split('|')[1].toLowerCase()===c));const i=$('input[type=color]',r);if(i&&i!==D.activeElement)i.value=c})}
try{const prev=V.settings;V.settings=function(){const h=prev.apply(this,arguments),m=/<section class="cfs"><h3>Conteúdo<\/h3>/;return m.test(h)?h.replace(m,x=>section()+x):h+section()}}catch(e){}
D.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-cgx-sw],[data-cgx-reset]');if(!t)return;e.stopPropagation();if(t.dataset.cgxSw){const[k,h]=t.dataset.cgxSw.split('|');setTone(k,h)}else resetTone(t.dataset.cgxReset)},true);
D.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.cgxCc)setTone(t.dataset.cgxCc,t.value)});
later();
})();
</script>

<script id="akaz-island-js">
/* AKAZ Island — etapa 1: ilha informativa (compacta, expandida e central), aparência configurável e barramento de eventos.
   Histórico local provisório (localStorage). Supabase: etapas 2–4 chamam AKAZ_EVENTS.emit com o mesmo formato. */
(()=>{
const D=document,$=(q,r=D)=>r.querySelector(q),RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const S=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={chat:S('<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3.1A7.4 7.4 0 1 1 20 11.5Z"/>'),check:S('<path d="M5 12.5l4.2 4.2L19 7"/>'),edit:S('<path d="M4 20l4.2-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20ZM13.5 7.5l3 3"/>'),flag:S('<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>'),doc:S('<path d="M7 3.5h6.5l5 5v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M13.5 3.5v5h5M8.5 13h7M8.5 16.5h5"/>'),task:S('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.6 2.6 4.4-5"/>'),cal:S('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 9h18"/>'),card:S('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h3"/>'),bell:S('<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'),x:S('<path d="M7 7l10 10M17 7L7 17"/>')};
Object.assign(I,{list:S('<path d="M8 6.5h11M8 12h11M8 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>')});
const T={
 approved:{c:'80,150,100',i:'check',cat:'Aprovação',t:'Projeto aprovado',a:'Abrir projeto',r:'projects',f:[['Cliente','client'],['Projeto','project'],['Responsável pela aprovação','actor']],d:e=>`${e.actor||'O cliente'} aprovou o projeto. Ele está liberado para avançar para a próxima etapa.`},
 post_approved:{c:'80,150,100',i:'check',cat:'Aprovação',t:'Publicação aprovada',a:'Visualizar publicação',r:'content',f:[['Cliente','client'],['Projeto','project'],['Conteúdo','item']],d:e=>`${e.actor||'O cliente'} aprovou a publicação. O conteúdo está liberado para seguir para programação ou entrega.`},
 changes:{c:'255,102,51',i:'edit',cat:'Atenção',t:'Alteração solicitada',a:'Ver solicitações',r:'approvals',f:[['Cliente','client'],['Projeto','project'],['Item','item']],d:()=>'Foram solicitadas alterações neste material. Consulte as solicitações para identificar os ajustes necessários.'},
 revision:{c:'255,102,51',i:'edit',cat:'Atenção',t:'Conteúdo em alteração',a:'Abrir conteúdo',r:'content',f:[['Cliente','client'],['Projeto','project'],['Conteúdo','item']],d:()=>'Este conteúdo está passando por uma nova rodada de ajustes e ainda não está liberado para aprovação final.'},
 message:{c:'120,140,110',i:'chat',cat:'Comunicação',t:'Nova mensagem recebida',a:'Abrir conversa',r:'conversations',f:[['Cliente','client'],['Remetente','actor'],['Projeto','project']],d:e=>e.project?'Você recebeu uma nova mensagem relacionada ao projeto.':'Você recebeu uma nova mensagem.'},
 payment:{c:'40,100,60',i:'card',cat:'Financeiro',t:'Pagamento confirmado',a:'Consultar financeiro',r:'payments',f:[['Cliente','client'],['Projeto','project'],['Referência','item'],['Valor recebido','amount']],d:()=>'O pagamento foi registrado e confirmado no financeiro do Workspace.'},
 doc:{c:'150,110,200',i:'doc',cat:'Documentos',t:'Novo documento recebido',a:'Abrir documento',r:'docs',f:[['Cliente','client'],['Projeto','project'],['Documento','item']],d:()=>'Um novo documento foi disponibilizado no portal do cliente.'},
 deadline:{c:'214,165,60',i:'cal',cat:'Prazo',t:'Prazo próximo',a:'Abrir tarefa',r:'projects',f:[['Cliente','client'],['Projeto','project'],['Tarefa','item']],d:()=>'Esta tarefa possui um prazo próximo. Consulte o projeto para acompanhar o andamento.'},
 task:{c:'143,168,116',i:'task',cat:'Tarefa',t:'Nova tarefa',a:'Ver tarefa',r:'projects',f:[['Cliente','client'],['Projeto','project'],['Tarefa','item']]},
 stage:{c:'154,156,143',i:'flag',cat:'Andamento',t:'Atualização de etapa',a:'Abrir conteúdo',r:'content',f:[['Cliente','client'],['Projeto','project'],['Conteúdo','item']]},
 update:{c:'154,156,143',i:'bell',cat:'Atualização',t:'Atualização',a:'Abrir',r:'home',f:[]}};
const classify=t=>/(agora está em|movido para) Em altera/i.test(t)?'revision':/agora está em|movido para/i.test(t)?'stage':/altera/i.test(t)?'changes':/aprovou/i.test(t)?'post_approved':/mensagem/i.test(t)?'message':/pagamento/i.test(t)?'payment':/tarefa/i.test(t)?'task':/prazo/i.test(t)?'deadline':/documento|arquivo/i.test(t)?'doc':'update';
const KEY='akaz-island-events',THK='akaz-island-theme',ld=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
let H=ld();const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(H.slice(0,60)))}catch(e){}};
const subs=new Set();let seq=0;
const dsc=e=>{const d=T[e.type]||T.update;return e.desc||(typeof d.d==='function'?d.d(e):'')||e.body||''};
const E=window.AKAZ_EVENTS={types:T,
 make(text,o){o=o||{};const type=T[o.type]?o.type:classify(String(text||'')),d=T[type];return Object.assign({id:'ev'+Date.now()+'-'+(++seq),title:/coment/i.test(text)&&type==='update'?'Novo comentário':/enviado para aprovação/i.test(text)?'Enviado para aprovação':d.t,body:String(text||''),route:d.r,action:d.a,ts:Date.now(),source:'local',read:false,dismissed:false},o,{type})},
 emit(ev){if(!ev.example){if(H.some(x=>x.type===ev.type&&x.item===ev.item&&x.status===ev.status&&x.client===ev.client&&Math.abs(ev.ts-x.ts)<3000))return ev;H.unshift(ev);if(H.length>60)H.length=60;sv()}subs.forEach(f=>{try{f(ev)}catch(e){console.error('AKAZ_EVENTS',e)}});return ev},
 on(f){subs.add(f);return()=>subs.delete(f)},history:()=>H.slice()};
window.akazPE=(p,type,x)=>{const c=(typeof clients!=='undefined'&&clients.find(k=>k.id==p.c))||{};return Object.assign({type,client:c.n||'',item:p.t,status:p.s,route:'post-'+p.id},x||{})};

// ===== Ilha =====
const ki=D.createElement('div');ki.className='ki';ki.hidden=true;ki.dataset.m='compact';ki.setAttribute('aria-live','polite');ki.setAttribute('role','status');
ki.innerHTML=`<div class="ki-card"><div class="ki-head"><button type="button" class="ki-main" data-k="main" aria-expanded="false"><span class="ki-ic"></span><span class="ki-tx"><b></b><span></span></span><span class="ki-badge" hidden></span></button><time class="ki-time"></time><button type="button" class="ki-x" data-k="x" aria-label="Dispensar">${I.x}</button></div><div class="ki-b"><div class="ki-bi"></div></div></div>`;
D.body.append(ki);
const q=s=>$(s,ki),mq=matchMedia('(prefers-color-scheme:dark)');
const pref=()=>{try{const v=localStorage.getItem(THK);return v==='dark'||v==='auto'?v:'light'}catch(e){return'light'}};
const applyTh=()=>{const p=pref();ki.dataset.th=p==='auto'?(mq.matches?'dark':'light'):p};
if(mq.addEventListener)mq.addEventListener('change',applyTh);applyTh();
let cur=null,hideT,outT,swapT,recent=[],paused=false,from='';
const off=()=>{try{return localStorage.getItem('akaz-island')==='off'}catch(e){return false}};
const onLogin=()=>(location.hash||'#login').slice(1).split('-')[0]==='login';
const hm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const when=ts=>new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const unread=()=>H.filter(x=>!x.read).length;
const mode=()=>ki.dataset.m;
function fillHead(){const m=mode();let d,title,sub,ts,col;if(m==='center'){d=T.update;title='Central de notificações';const u=unread();sub=u?`${u} não lida${u>1?'s':''} · ${H.length} evento${H.length>1?'s':''}`:`${H.length} evento${H.length===1?'':'s'} no histórico`;ts=0;col='154,156,143';q('.ki-ic').innerHTML=I.list}else{const e=cur;d=T[e.type]||T.update;title=e.title;sub=[e.client,e.project||e.item].filter(Boolean).join(' · ')||e.body;ts=e.ts;col=d.c;q('.ki-ic').innerHTML=I[d.i]||I.bell}
 ki.style.setProperty('--kc',col);q('.ki-tx b').textContent=title;q('.ki-tx span').textContent=sub;const t=q('.ki-time');t.textContent=ts?hm(ts):'';if(ts)t.dateTime=new Date(ts).toISOString();
 const u=unread(),b=q('.ki-badge');b.hidden=!(m==='compact'&&u>1);b.textContent=u>9?'9+':u;q('.ki-main').setAttribute('aria-expanded',m==='compact'?'false':'true')}
function detail(e){const d=T[e.type]||T.update,rows=d.f.map(([l,k])=>e[k]?`<div><dt>${l}</dt><dd>${esc(e[k])}</dd></div>`:'').join('')+(e.status&&!['message','payment','doc'].includes(e.type)?`<div><dt>Status</dt><dd>${esc(e.status)}</dd></div>`:'');
 return `<div class="ki-d" style="--kc:${d.c}"><div class="ki-meta"><span class="ki-cat">${esc(d.cat)}${e.example?' · exemplo':''}</span><span class="ki-when">${when(e.ts)}</span></div>${rows?`<dl class="ki-f">${rows}</dl>`:''}<p class="ki-p">${esc(dsc(e))}</p>${e.preview&&e.preview.text?`<blockquote class="ki-q"><b>${esc(e.preview.author||'Comentário')}</b><span>“${esc(e.preview.text)}”</span></blockquote>`:''}<div class="ki-ac"><button type="button" class="ki-act" data-k="act">${esc(e.action||d.a)}</button><button type="button" class="ki-sec" data-k="dismiss">Dispensar</button><button type="button" class="ki-sec" data-k="center">Central</button></div></div>`}
function list(){return `<div class="ki-l"><div class="ki-lh"><span>Mais recentes primeiro</span><button type="button" class="ki-ghost" data-k="readall"${unread()?'':' disabled'}>Marcar todas como lidas</button></div>${H.length?`<div class="ki-ls">${H.slice(0,30).map(e=>{const d=T[e.type]||T.update;return `<button type="button" class="ki-li${e.read?'':' unread'}${e.dismissed?' dim':''}" data-k="li" data-id="${esc(e.id)}" style="--kc:${d.c}"><span class="ki-ic">${I[d.i]||I.bell}</span><span class="ki-tx"><b>${esc(e.title)}</b><span>${esc([e.client,e.project||e.item].filter(Boolean).join(' · ')||e.body)}</span></span><time>${hm(e.ts)}</time><i class="ki-dot" aria-hidden="true"></i></button>`}).join('')}</div>`:'<div class="ki-empty">Nenhum evento ainda. As atividades reais do Workspace aparecem aqui.</div>'}</div>`}
function render(){fillHead();const m=mode(),bi=q('.ki-bi');if(m==='open')bi.innerHTML=detail(cur);else if(m==='center')bi.innerHTML=list();else{clearTimeout(render.t);render.t=setTimeout(()=>{if(mode()==='compact')bi.innerHTML=''},RM()?0:340)}}
function setMode(m){ki.dataset.m=m;clearTimeout(hideT);render();if(m==='compact')arm(3500)}
function arm(ms){clearTimeout(hideT);if(paused||mode()!=='compact')return;hideT=setTimeout(dismiss,ms)}
function reveal(){clearTimeout(outT);ki.hidden=false;ki.dataset.s='';void ki.offsetWidth;requestAnimationFrame(()=>{ki.dataset.s='show'})}
function dismiss(){clearTimeout(hideT);if(ki.hidden||ki.dataset.s==='out')return;if(cur&&mode()!=='center'){const h=H.find(x=>x.id===cur.id);if(h)h.dismissed=true;cur.dismissed=true;sv()}ki.dataset.s='out';outT=setTimeout(()=>{ki.hidden=true;ki.dataset.s='';ki.dataset.m='compact';q('.ki-bi').innerHTML='';cur=null},RM()?0:240)}
function show(ev){if(off()||onLogin())return;clearTimeout(outT);clearTimeout(swapT);
 if(!ki.hidden&&ki.dataset.s==='show'&&mode()!=='compact'){if(mode()==='center')render();else fillHead();return}
 if(ki.hidden||ki.dataset.s==='out'){cur=ev;ki.dataset.m='compact';render();reveal()}
 else{ki.classList.add('ki-swap');swapT=setTimeout(()=>{cur=ev;render();ki.classList.remove('ki-swap')},RM()?0:110)}
 arm(6000)}
function expand(ev,fromC){cur=ev;from=fromC?'center':'';const h=H.find(x=>x.id===ev.id);if(h&&!h.read){h.read=true;sv()}ev.read=true;setMode('open')}
function openCenter(){if(off())return;clearTimeout(outT);if(ki.hidden||ki.dataset.s==='out'){cur=cur||H[0]||null;ki.dataset.m='center';render();reveal()}else setMode('center');ki.dataset.m='center';render()}
function go(){if(!cur)return;const r=cur.route,e=cur;const h=H.find(x=>x.id===e.id);if(h){h.read=true;sv()}dismiss();if(r==='center'){setTimeout(openCenter,260);return}if(r){const hh='#'+r;if(location.hash===hh)window.dispatchEvent(new HashChangeEvent('hashchange'));else location.hash=hh}}
E.on(ev=>{const n=Date.now();recent=recent.filter(t=>n-t<7000);recent.push(n);
 if(recent.length>=4)show({id:'sum'+n,type:'update',icon:'bell',title:recent.length+' novas notificações',body:'Abra a central para ver todas.',route:'center',action:'Abrir central',ts:n,example:false,summary:true});else show(ev)});
ki.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(!t)return;e.stopPropagation();const k=t.dataset.k;
 if(k==='main'){if(mode()==='compact'){if(cur&&cur.summary)openCenter();else if(cur)expand(cur,false)}else if(mode()==='open'&&from==='center')setMode('center');else setMode('compact')}
 else if(k==='x'||k==='dismiss')dismiss();else if(k==='act')go();else if(k==='center')openCenter();
 else if(k==='readall'){H.forEach(x=>x.read=true);sv();render()}
 else if(k==='li'){const ev=H.find(x=>x.id===t.dataset.id);if(ev)expand(ev,true)}});
ki.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;paused=true;clearTimeout(hideT)});
